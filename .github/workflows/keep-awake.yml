# Render's free plan sleeps after 15 idle minutes and takes ~50 s to wake up.
# This pings the live site every 10 minutes so judges never hit a cold start.
# Set the site URL once: repo Settings -> Secrets and variables -> Actions -> Variables -> SITE_URL
# (e.g. https://lost-found-hub.onrender.com). Without it, the job does nothing.
name: Keep demo awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 2 "$SITE_URL/api/health"
