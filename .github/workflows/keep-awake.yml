# Render's free plan sleeps after 15 idle minutes and takes ~50 s to wake up.
# This pings the live site so judges never hit a cold start, whenever they visit.
# GitHub may start scheduled runs late, so each run pings twice, 2.5 minutes apart.
# Set the site URL once: repo Settings -> Secrets and variables -> Actions -> Variables -> SITE_URL
# (e.g. https://lost-found-hub.onrender.com). Without it, the job does nothing.
# If the site is down, the run fails and GitHub emails you.
name: Keep demo awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 2 "$SITE_URL/api/health"
          echo
          sleep 150
          curl --fail --silent --show-error --max-time 90 --retry 2 "$SITE_URL/api/health"
